<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>诗册 · 悬浮古籍</title>
<link rel="stylesheet" href="css/site.css">
<style>
  html, body { overflow: hidden; height: 100%; }
  body {
    background:
      radial-gradient(78% 62% at 50% 43%, #31261a 0%, #1d1712 38%, #0d0b09 72%, #070606 100%);
  }
  #stage { position: fixed; inset: 0; z-index: 1; }
  #stage canvas { display: block; touch-action: none; }

  /* 书后温润光晕 */
  .halo {
    position: fixed; left: 50%; top: 50%; z-index: 0; pointer-events: none;
    width: min(112vh, 105vw); height: min(112vh, 105vw);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 50% 50%,
      rgba(255,214,150,.15) 0%, rgba(240,190,120,.09) 26%,
      rgba(180,130,70,.045) 48%, rgba(0,0,0,0) 72%);
    filter: blur(12px);
  }
  .halo::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255,240,210,.10) 0%, rgba(0,0,0,0) 40%);
  }

  /* ---- 底部极简古风阅读条 ---- */
  #reading-bar {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 25;
    background: rgba(18, 14, 11, 0.82);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(200, 168, 106, 0.26);
    border-radius: 999px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,240,210,0.08);
    display: flex; align-items: center; gap: 14px; padding: 6px 18px;
    transition: all 0.3s ease;
  }
  .bar-btn {
    background: none; border: 0; color: var(--text); font-family: var(--serif);
    font-size: 13.5px; letter-spacing: 0.16em; cursor: pointer; padding: 6px 10px;
    transition: color 0.2s, transform 0.2s; white-space: nowrap;
  }
  .bar-btn:hover:not(:disabled) { color: #f3e6c8; transform: translateY(-1px); }
  .bar-btn:disabled { opacity: 0.24; cursor: default; }
  .bar-status {
    display: flex; align-items: center; gap: 10px; font-size: 13px;
    letter-spacing: 0.2em; color: var(--text); font-family: var(--serif); white-space: nowrap;
  }
  .bar-rule { width: 1px; height: 13px; background: rgba(200, 168, 106, 0.32); }
  #cur-poem-title { color: var(--gold); font-size: 14px; }
  #cur-page-info { font-size: 12px; color: var(--text-dim); }
  .bar-divider { width: 1px; height: 16px; background: rgba(200, 168, 106, 0.22); }
  
  /* 展卷：翻动书页至最新一首诗（核心典雅按键） */
  .bar-btn-riffle {
    background: linear-gradient(135deg, rgba(200, 168, 106, 0.22), rgba(168, 51, 43, 0.28));
    border: 1px solid rgba(200, 168, 106, 0.55);
    border-radius: 999px; padding: 6px 16px;
    color: #f7eedb; font-family: var(--serif); font-size: 13.5px; letter-spacing: 0.18em;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap; flex-shrink: 0;
  }
  .bar-btn-riffle:hover {
    background: linear-gradient(135deg, rgba(200, 168, 106, 0.38), rgba(168, 51, 43, 0.42));
    border-color: var(--gold); transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(168, 51, 43, 0.35);
    color: #fff;
  }
  .bar-btn-riffle:active {
    transform: scale(0.96);
  }
  .riffle-icon { font-size: 15px; line-height: 1; }
  .riffle-txt { font-size: 13.5px; font-weight: 500; }
  .bar-tools { display: flex; align-items: center; gap: 6px; }
  .tool-btn {
    background: none; border: 0; color: var(--text-dim); font-family: var(--serif);
    font-size: 12.5px; letter-spacing: 0.16em; cursor: pointer; padding: 4px 8px;
    transition: color 0.2s; white-space: nowrap;
  }
  .tool-btn:hover { color: var(--gold); }
  .tool-btn.off { opacity: 0.45; }

  /* 操作提示 */
  #hint {
    position: fixed; left: 50%; bottom: 82px; transform: translateX(-50%); z-index: 20;
    font-size: 12.5px; letter-spacing: 0.3em; color: rgba(232,220,192,0.48);
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.5s;
    background: rgba(0,0,0,0.4); padding: 4px 16px; border-radius: 999px;
  }
  #hint.show { opacity: 1; }

  /* ---- 装帧页 ---- */
  #loader {
    position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    background: radial-gradient(70% 60% at 50% 45%, #171310, #080706 80%);
    transition: opacity .9s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .seal {
    width: 62px; height: 62px; border: 1.5px solid rgba(168,51,43,.8); color: #c0564b;
    display: flex; align-items: center; justify-content: center; font-size: 18px; letter-spacing: .06em;
    background: rgba(168,51,43,.08); border-radius: 3px; animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  #loader-msg { font-size: 12.5px; letter-spacing: .34em; color: var(--text-dim); }
  .bar { width: 200px; height: 1px; background: rgba(232,220,192,.13); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, rgba(200,168,106,.35), var(--gold)); transition: width .3s ease; }
  #loader-pct { font-size: 11px; letter-spacing: .22em; color: rgba(232,220,192,.3); }

  /* 手机屏幕边缘轻触翻页指示器 */
  .screen-edge-tap {
    position: fixed; top: 48%; transform: translateY(-50%); z-index: 24;
    width: 44px; height: 110px; display: flex; align-items: center; justify-content: center;
    color: rgba(200, 168, 106, 0.45); font-size: 36px; font-family: var(--serif);
    cursor: pointer; user-select: none; transition: all 0.25s ease;
    background: linear-gradient(to right, rgba(0,0,0,0.32), transparent);
    border-radius: 0 16px 16px 0;
  }
  .screen-edge-tap.right {
    right: 0; left: auto; border-radius: 16px 0 0 16px;
    background: linear-gradient(to left, rgba(0,0,0,0.32), transparent);
  }
  .screen-edge-tap:active {
    color: #f6eedb;
    background: rgba(200, 168, 106, 0.25);
    transform: translateY(-50%) scale(1.06);
  }
  @media (min-width: 861px) {
    .screen-edge-tap { display: none; }
  }

  /* 移动端全面优化 */
  @media (max-width: 860px) {
    .nav {
      height: 52px; padding: 0 14px;
    }
    .nav-title {
      font-size: 18px !important; letter-spacing: 0.16em;
    }
    .nav-sub { display: none; }
    .nav-links { gap: 8px; }
    .nav-links a {
      font-size: 13.5px; padding: 5px 9px;
    }
    .nav-studio-btn {
      background: linear-gradient(135deg, rgba(111, 164, 148, 0.32), rgba(200, 168, 106, 0.25)) !important;
      border: 1px solid rgba(111, 164, 148, 0.65) !important;
      color: #e6f5ef !important;
      border-radius: 999px !important;
      padding: 4px 12px !important;
      font-weight: 500;
    }
    @media (max-width: 480px) {
      .nav-title { font-size: 16px !important; letter-spacing: 0.12em; }
      .nav-links { gap: 4px; }
      .nav-links a { font-size: 12.5px; padding: 4px 6px; }
      .nav-brand-prefix { display: none; }
      .nav-about-link { display: none; }
    }

    #reading-bar {
      bottom: 14px; padding: 6px 10px; gap: 6px; width: calc(100vw - 20px); max-width: 440px;
      justify-content: space-between; border-radius: 999px;
      box-shadow: 0 14px 42px rgba(0,0,0,0.85), 0 0 0 1px rgba(200, 168, 106, 0.35);
      background: rgba(14, 11, 8, 0.94);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .bar-btn {
      padding: 8px 12px; font-size: 13.5px; min-height: 42px; min-width: 60px; flex-shrink: 0;
      background: rgba(200, 168, 106, 0.15); border: 1px solid rgba(200, 168, 106, 0.32);
      border-radius: 999px; color: #f7eedb; font-weight: 500;
    }
    .bar-btn:active:not(:disabled) {
      background: rgba(200, 168, 106, 0.35); transform: scale(0.96);
    }
    .bar-btn:disabled {
      opacity: 0.28; pointer-events: none;
    }
    .bar-status {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center;
      padding: 0 4px;
    }
    #cur-poem-title {
      font-size: 15px; font-weight: bold; color: var(--gold); letter-spacing: 0.08em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    #cur-page-info {
      display: block; font-size: 11px; color: rgba(232, 220, 192, 0.70); letter-spacing: 0.04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .bar-rule { display: none; }
    .bar-btn-riffle {
      padding: 8px 12px; font-size: 13px; min-height: 42px; border-radius: 999px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      background: linear-gradient(135deg, rgba(200, 168, 106, 0.22), rgba(168, 51, 43, 0.32));
      border: 1px solid rgba(200, 168, 106, 0.6); color: #f7eedb;
    }
    .riffle-icon { font-size: 15px; margin: 0; }
    .riffle-txt { display: inline; font-size: 13px; letter-spacing: 0.08em; }
    .bar-tools { display: none; }
    #hint {
      bottom: 84px; font-size: 13.5px; padding: 6px 18px; letter-spacing: 0.18em;
    }
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="bg-layer far"></div>
    <div class="bg-layer mid"></div>
    <div class="bg-layer mistimg"></div>
    <div class="mist"></div>
  </div>
  <div class="halo"></div>

  <div id="stage"></div>
  <div class="frame"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <nav class="nav">
    <div class="nav-brand">
      <a class="nav-title" id="brand-title" href="index.html">墨瀾詩草</a>
      <div class="nav-sub" id="brand-sub">甲辰首編 · 墨瀾·著</div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="on">诗册</a>
      <a href="poems.html">诗集</a>
      <a href="studio.html" class="nav-studio-btn"><span class="nav-brand-prefix">墨瀾</span>诗台</a>
      <a href="poems.html#about" class="nav-about-link">关于</a>
    </div>
  </nav>

  <div id="hint" class="ui"></div>

  <!-- 手机端屏幕边缘轻触翻页指示 -->
  <div id="tap-prev" class="screen-edge-tap left" title="轻触翻上一叶" aria-label="上一叶"><span>‹</span></div>
  <div id="tap-next" class="screen-edge-tap right" title="轻触翻下一叶" aria-label="下一叶"><span>›</span></div>

  <!-- 底部极简古风阅读控制条 -->
  <div id="reading-bar" class="ui">
    <button id="btn-prev" class="bar-btn" title="翻上一叶（← / A / 左滑）">‹ 前叶</button>
    <div class="bar-status">
      <span id="cur-poem-title">《旧颜》</span>
      <span class="bar-rule"></span>
      <span id="cur-page-info">第 2 叶 · 清秋月夜</span>
    </div>
    <button id="btn-next" class="bar-btn" title="翻下一叶（→ / D / 右滑）">后叶 ›</button>
    <div class="bar-divider"></div>
    <button id="btn-latest" class="bar-btn-riffle" title="展卷：翻动书页至最新一首诗（End）">
      <span class="riffle-icon">📜</span>
      <span class="riffle-txt">展卷</span>
    </button>
    <div class="bar-tools">
      <button id="btn-pose" class="tool-btn" title="立起／平放（F）">伏案</button>
      <button id="btn-sound" class="tool-btn" title="翻页清音开关" aria-pressed="true">清音</button>
    </div>
  </div>

  <div id="loader">
    <div class="seal">装帧</div>
    <div id="loader-msg">正在装帧…</div>
    <div class="bar"><i id="loader-bar"></i></div>
    <div id="loader-pct">0%</div>
  </div>

  <script src="libs/three.min.js"></script>
  <script src="js/seal_data.js"></script>
  <script src="content.js"></script>
  <script src="js/api.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/lunar.js"></script>
  <script src="js/typeset.js"></script>
  <script src="js/book.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
